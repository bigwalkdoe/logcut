[package]
name = "logcut"
version = "0.3.0"
edition = "2024"
description = "Local-first stacktrace, runtime log & compiler error slicing for AI coding agents and terminal pipelines"
license = "MIT OR Apache-2.0"
keywords = ["mcp", "logs", "stacktrace", "debugging", "cli"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/logcut"
repository = "https://github.com/bigwalkdoe/logcut"
readme = "README.md"

[features]
default = ["cli", "mcp"]
cli = ["dep:reqwest"]
mcp = ["dep:rmcp"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.11"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Optional interface layers
rmcp = { version = "3.9", features = ["server", "macros", "transport-io"], optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }

[dev-dependencies]
tempfile = "3.15"
