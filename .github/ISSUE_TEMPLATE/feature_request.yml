name: Feature request
description: Suggest a new parser, source, tool, or CLI capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the logs or workflow that `logcut` currently handles poorly.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Sketch the tool/command, inputs, and output you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: invariants
    attributes:
      label: Architecture check
      options:
        - label: This can be implemented in `src/core/` without UI or network coupling
          required: false
        - label: It preserves secret redaction and bounded input reads
          required: false
